<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>RS One — Family Digital Home</title><style>
:root{--ink:#172033;--muted:#68738a;--bg:#f5f7fb;--card:#fff;--line:#e5e9f2;--indigo:#4f46e5;--blue:#2563eb;--violet:#7c3aed;--coral:#f97362;--mint:#20b486;--yellow:#f4b740;--shadow:0 10px 30px #1d274012}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;border:0;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 24px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#6366f1,#a855f7,#fb7185);display:grid;place-items:center;font-weight:900}.brand b{font-size:19px}.brand span{display:block;font-size:11px;color:#aeb7c8;margin-top:2px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.nav button.active{box-shadow:inset 3px 0 #818cf8}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}.crumb{font-weight:750}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#e0e7ff;display:grid;place-items:center;font-weight:800;color:#3730a3}.content{max-width:1400px;margin:auto;padding:28px}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--indigo)}h1{font-size:30px;margin:5px 0 5px;letter-spacing:-.03em}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 7px}.sub{color:var(--muted);margin:0;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;background:var(--indigo);color:#fff;font-weight:700}.btn.alt{background:#eef2ff;color:#3730a3}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.hero{background:linear-gradient(120deg,#eef2ff,#f5f3ff 55%,#fff1ed);border:0}.metric{font-size:27px;font-weight:850;margin:5px 0}.small{font-size:12px;color:var(--muted)}.tag{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f1f5f9;font-size:11px;font-weight:750;margin:2px}.tag.blue{background:#dbeafe;color:#1d4ed8}.tag.green{background:#d1fae5;color:#047857}.tag.pink{background:#fce7f3;color:#be185d}.tag.yellow{background:#fef3c7;color:#92400e}.tag.violet{background:#ede9fe;color:#6d28d9}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6);border-radius:99px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:12px;background:#eef2ff;display:grid;place-items:center;font-size:19px}.item{display:flex;gap:11px;align-items:center}.timeline{border-left:2px solid #dfe4f0;margin-left:8px;padding-left:18px}.tl{position:relative;margin-bottom:18px}.tl:before{content:"";position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:#6366f1}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.pillbar{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.pill{white-space:nowrap;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:12px}.notice{padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{display:none}.section{display:none}.section.active{display:block}.footer{padding:30px 0 10px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:950px){.side{width:205px}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.side{display:none}.top{padding:0 16px}.content{padding:18px 14px}.g2,.g3,.g4{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:9;overflow:auto}.mobile-nav button{min-width:78px;padding:10px 7px;background:#fff;color:#657086;font-size:10px}.mobile-nav button.active{color:var(--indigo);font-weight:800}.content{padding-bottom:85px}.pagehead{align-items:flex-start;flex-direction:column}h1{font-size:25px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">RS</div><div><b>RS One</b><span>One place for everything that matters.</span></div></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><div class="crumb" id="crumb">Home</div><div class="user"><span class="small">Family workspace</span><div class="avatar">RS</div></div></header><div class="content"><div id="pages"></div><div class="footer">RS One • Family digital home • Prototype for real-world family testing</div></div></main></div><div class="mobile-nav" id="mnav"></div><script>
const tabs=[['home','🏠','Home'],['vision','💭','Vision'],['explore','🌎','Explore'],['travel','✈️','Travel'],['family','👨‍👩‍👧‍👦','Family'],['money','💰','Money'],['memberships','🎫','Memberships'],['map','🗺️','Map'],['memories','📸','Memories'],['vault','🔐','Vault'],['alerts','🔔','Alerts'],['analytics','📊','Analytics'],['data','📤','Data']];
const nav=document.getElementById('nav'),mnav=document.getElementById('mnav'),pages=document.getElementById('pages');
tabs.forEach(([id,ic,name])=>{let b=document.createElement('button');b.dataset.tab=id;b.innerHTML=ic+' &nbsp;'+name;b.onclick=()=>show(id);nav.appendChild(b);let mb=b.cloneNode(true);mb.onclick=()=>show(id);mnav.appendChild(mb);let s=document.createElement('section');s.id='page-'+id;s.className='section';s.innerHTML=content[id];pages.appendChild(s)});
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.getElementById('crumb').textContent=tabs.find(x=>x[0]===id)[2];window.scrollTo({top:0,behavior:'smooth'})}
const card=(title,body,cls='')=>`<div class="card ${cls}"><h2>${title}</h2>${body}</div>`;
const content={
home:`<div class="pagehead"><div><div class="eyebrow">Good afternoon, family</div><h1>Welcome to RS One</h1><p class="sub">Your family's digital home — plans, dreams, travel, money and memories in one place.</p></div><div class="actions"><button class="btn" onclick="show('travel')">Plan a trip</button><button class="btn alt" onclick="show('vision')">Add to Vision</button></div></div><div class="grid g4"><div class="card"><div class="small">Next adventure</div><div class="metric">Japan</div><span class="tag blue">Spring 2027</span></div><div class="card"><div class="small">Family Wishlist</div><div class="metric">18</div><span class="tag pink">6 new ideas</span></div><div class="card"><div class="small">Countries together</div><div class="metric">12</div><span class="tag green">3 this year</span></div><div class="card"><div class="small">Family pulse</div><div class="metric">92%</div><span class="tag yellow">Planning active</span></div></div><br><div class="grid g2">${card('Family Vision',`<div class="hero" style="padding:15px;border-radius:13px"><h3>Build the life you want to remember.</h3><p class="sub">Japan • Safari • Northern Lights • Family learning • More time together</p><br><div class="progress"><i style="width:64%"></i></div><p class="small">64% of this year's shared goals are planned</p></div>`)}${card('Family Pulse',`<div class="list"><div class="row"><div class="item"><div class="icon">✈️</div><div><b>Japan trip idea added</b><div class="small">Aarav • 12 min ago</div></div></div><span class="tag violet">New</span></div><div class="row"><div class="item"><div class="icon">🗳️</div><div><b>Safari vote is open</b><div class="small">3 of 5 family members voted</div></div></div><button class="btn light" onclick="show('vision')">Vote</button></div><div class="row"><div class="item"><div class="icon">🎫</div><div><b>Membership benefit found</b><div class="small">Hotel breakfast may be included</div></div></div><span class="tag green">Value</span></div></div>`)}${card('Next Adventure',`<div class="grid g2"><div><h3>Dubai • Family escape</h3><p class="sub">4 travellers • 5 nights • Feb 2027</p><br><span class="tag blue">Flights watched</span><span class="tag green">Hotel shortlisted</span></div><div style="text-align:right"><div class="metric">₹2.84L</div><div class="small">current estimate</div><button class="btn" onclick="show('travel')">Open trip</button></div></div>`)}${card('RS One suggestions',`<div class="list"><div class="row"><span>Consider adding Kyoto to Japan itinerary</span><span class="tag violet">Explore</span></div><div class="row"><span>One membership benefit may reduce hotel cost</span><span class="tag green">Save</span></div><div class="row"><span>Dad's birthday is 24 days away</span><span class="tag yellow">Family</span></div></div>`)}</div>`,
vision:`<div class="pagehead"><div><div class="eyebrow">Family direction</div><h1>Family Vision</h1><p class="sub">The bigger picture beyond the next holiday.</p></div><button class="btn">+ Add vision goal</button></div><div class="grid g3">${card('Places','<div class="metric">14</div><p class="sub">Dream destinations</p><span class="tag blue">Japan</span><span class="tag blue">Switzerland</span><span class="tag blue">Safari</span>')}${card('Experiences','<div class="metric">9</div><p class="sub">Things we want to do together</p><span class="tag pink">Northern Lights</span><span class="tag yellow">Diving</span>')}${card('Learning','<div class="metric">7</div><p class="sub">Family learning goals</p><span class="tag green">Languages</span><span class="tag violet">World history</span>')}</div><br>${card('Vision timeline',`<div class="timeline"><div class="tl"><b>2026 — Dubai</b><p class="sub">Family city break • architecture • desert experience</p></div><div class="tl"><b>2027 — Japan</b><p class="sub">Tokyo • Kyoto • food • culture • family discovery</p></div><div class="tl"><b>2028 — Switzerland</b><p class="sub">Alps • rail journey • lakes</p></div><div class="tl"><b>2029 — Safari</b><p class="sub">Wildlife • photography • shared adventure</p></div><div class="tl"><b>2030 — Northern Lights</b><p class="sub">A long-held family dream</p></div></div>`)}<br>${card('Where should we go next?',`<div class="grid g3"><div class="notice"><b>Japan</b><p class="small">4 votes • strong child interest</p><button class="btn alt">Vote Japan</button></div><div class="notice"><b>Switzerland</b><p class="small">3 votes • highest comfort</p><button class="btn alt">Vote Switzerland</button></div><div class="notice"><b>Safari</b><p class="small">2 votes • new experience</p><button class="btn alt">Vote Safari</button></div></div>`)}`,
explore:`<div class="pagehead"><div><div class="eyebrow">Discover together</div><h1>Explore</h1><p class="sub">A family learning and discovery engine.</p></div><button class="btn">Start a quiz</button></div><div class="pillbar"><button class="pill">World</button><button class="pill">Countries</button><button class="pill">Cities</button><button class="pill">History</button><button class="pill">Science</button><button class="pill">Food</button><button class="pill">Animals</button><button class="pill">Space</button></div><br><div class="grid g3">${card('Today’s discovery','<div class="icon">🌋</div><br><h3>Why do volcanoes erupt?</h3><p class="sub">A five-minute family discovery with facts, pictures and questions.</p><br><span class="tag violet">Learn</span>')}${card('Family quiz','<div class="metric">8 / 10</div><p class="sub">World capitals challenge</p><div class="progress"><i style="width:80%"></i></div><br><button class="btn">Continue</button>')}${card('My discoveries','<div class="list"><div class="row"><span>🇯🇵 Kyoto</span><span class="tag blue">Saved</span></div><div class="row"><span>🦒 Maasai Mara</span><span class="tag green">Saved</span></div><div class="row"><span>🌌 Iceland</span><span class="tag pink">Wishlist</span></div></div>')}</div>`,
travel:`<div class="pagehead"><div><div class="eyebrow">Travel intelligence</div><h1>Plan the family trip</h1><p class="sub">Tell RS One what you want. Compare options. Approve. Then book.</p></div><button class="btn">+ New trip</button></div><div class="card hero"><h2>What does the family want?</h2><div class="grid g3"><div><div class="small">Destination</div><h3>Japan</h3><p class="sub">Tokyo + Kyoto</p></div><div><div class="small">Travellers</div><h3>5 family members</h3><p class="sub">2 adults • 2 children • 1 teen</p></div><div><div class="small">Target</div><h3>₹4.5L</h3><p class="sub">Comfort + value</p></div></div><br><button class="btn">Run intelligent search</button></div><br><div class="grid g2">${card('Flight comparison',`<table class="table"><tr><th></th><th>Best overall</th><th>Cheapest</th></tr><tr><td>Airline</td><td>Singapore</td><td>IndiGo + partner</td></tr><tr><td>Total</td><td>₹1,42,800</td><td>₹1,27,400</td></tr><tr><td>Stops</td><td>1</td><td>2</td></tr><tr><td>Baggage</td><td>Included</td><td>Limited</td></tr><tr><td>Flexibility</td><td>High</td><td>Low</td></tr></table><br><span class="tag green">RS One pick</span> <span class="small">₹15,400 more, but better family value.</span>`) }${card('Hotel comparison',`<div class="list"><div class="row"><div><b>Tokyo family suite</b><div class="small">5 nights • breakfast • flexible</div></div><strong>₹82,000</strong></div><div class="row"><div><b>Central family room</b><div class="small">5 nights • no breakfast</div></div><strong>₹65,500</strong></div><div class="row"><div><b>Member-rate hotel</b><div class="small">5 nights • breakfast • upgrade eligible</div></div><strong>₹77,200</strong></div></div>`) }${card('Trip economics',`<div class="grid g2"><div><div class="small">Flights</div><b>₹1,42,800</b></div><div><div class="small">Hotel</div><b>₹77,200</b></div><div><div class="small">Transport</div><b>₹28,000</b></div><div><div class="small">Experiences</div><b>₹36,000</b></div></div><hr style="border:0;border-top:1px solid var(--line)"><div class="metric">₹2,84,000</div><div class="small">current family estimate</div>`) }${card('Itinerary',`<div class="timeline"><div class="tl"><b>Day 1</b><p class="sub">Arrive Tokyo • hotel • easy evening</p></div><div class="tl"><b>Day 2</b><p class="sub">Asakusa • Ueno • family food experience</p></div><div class="tl"><b>Day 3</b><p class="sub">Shinkansen → Kyoto • Gion evening</p></div><div class="tl"><b>Day 4</b><p class="sub">Fushimi Inari • Arashiyama</p></div></div><button class="btn alt">Modify itinerary</button>`)}</div>`,
family:`<div class="pagehead"><div><div class="eyebrow">Our people</div><h1>Family</h1><p class="sub">Everyone has a voice, preferences and a place in RS One.</p></div><button class="btn">+ Add family member</button></div><div class="grid g3">${['Dad','Mum','Aarav','Mia','Grandparent'].map((n,i)=>`<div class="card"><div class="item"><div class="avatar">${n[0]}</div><div><h3>${n}</h3><div class="small">${['Owner / Parent','Adult','Child','Child','Grandparent'][i]}</div></div></div><br><span class="tag blue">Travel</span><span class="tag pink">Wishlist</span><p class="sub">Favourite destination: ${['Japan','Italy','Switzerland','Singapore','Dubai'][i]}</p><button class="btn light">View profile</button></div>`).join('')}</div><br>${card('Shared Family Wishlist',`<div class="list"><div class="row"><span>🇯🇵 Japan family trip</span><span class="tag green">4 votes</span></div><div class="row"><span>🌌 Northern Lights</span><span class="tag blue">3 votes</span></div><div class="row"><span>🦁 Safari</span><span class="tag yellow">2 votes</span></div><div class="row"><span>🏔️ Switzerland rail journey</span><span class="tag violet">1 vote</span></div></div>`)}`,
money:`<div class="pagehead"><div><div class="eyebrow">Family economics</div><h1>Money</h1><p class="sub">Understand the cost of travel and everyday family economics.</p></div><button class="btn">Set trip budget</button></div><div class="grid g4">${card('USD / INR','<div class="metric">₹83.12</div><span class="tag blue">+0.2% today</span>')}${card('Gold 24K','<div class="metric">₹9,820/g</div><span class="tag yellow">Daily watch</span>')}${card('Silver','<div class="metric">₹116/g</div><span class="tag green">Watchlist</span>')}${card('Trip budget','<div class="metric">₹4.50L</div><span class="tag violet">68% planned</span>')}</div><br><div class="grid g2">${card('Destination economics',`<table class="table"><tr><th>Destination</th><th>5-night family estimate</th><th>Value</th></tr><tr><td>Dubai</td><td>₹2.84L</td><td>High</td></tr><tr><td>Japan</td><td>₹4.20L</td><td>Medium</td></tr><tr><td>Switzerland</td><td>₹5.10L</td><td>Medium</td></tr></table>`) }${card('Watchlist',`<div class="list"><div class="row"><span>USD/INR below ₹82.50</span><span class="tag blue">Alert on</span></div><div class="row"><span>Gold above ₹10,000/g</span><span class="tag yellow">Alert on</span></div><div class="row"><span>Japan hotel average below ₹14k</span><span class="tag green">Alert on</span></div></div>`)}</div>`,
memberships:`<div class="pagehead"><div><div class="eyebrow">Loyalty intelligence</div><h1>Memberships & Loyalty</h1><p class="sub">Connect memberships so RS One can consider benefits when planning.</p></div><button class="btn">+ Connect membership</button></div><div class="notice">🔒 RS One should use secure provider authorization where supported. Never enter or store provider passwords in RS One.</div><br><div class="grid g3">${card('Airlines',`<div class="list"><div class="row"><span>Emirates Skywards</span><span class="tag blue">Silver</span></div><div class="row"><span>Qatar Privilege Club</span><span class="tag yellow">Member</span></div><div class="row"><span>Air India Maharaja Club</span><span class="tag green">Silver</span></div></div>`) }${card('Hotels',`<div class="list"><div class="row"><span>Marriott Bonvoy</span><span class="tag violet">Gold</span></div><div class="row"><span>Hilton Honors</span><span class="tag blue">Member</span></div><div class="row"><span>Accor ALL</span><span class="tag green">Silver</span></div></div>`) }${card('Benefits found',`<div class="metric">₹18,600</div><p class="sub">Estimated value currently discoverable for the Japan trip.</p><span class="tag green">Breakfast</span><span class="tag blue">Baggage</span><span class="tag violet">Upgrade</span>`)}</div><br>${card('How RS One should use loyalty',`<div class="grid g4"><div><b>1. Identify</b><p class="small">Member status and benefits</p></div><div><b>2. Compare</b><p class="small">Member rate vs public rate</p></div><div><b>3. Score</b><p class="small">Include points and comfort</p></div><div><b>4. Explain</b><p class="small">Show why an option wins</p></div></div>`)}`,
map:`<div class="pagehead"><div><div class="eyebrow">Family geography</div><h1>Map</h1><p class="sub">See where we have been, where we want to go and what is planned.</p></div><div class="actions"><button class="btn alt">Visited</button><button class="btn alt">Wishlist</button></div></div><div class="card" style="min-height:360px;background:radial-gradient(circle at 30% 30%,#dbeafe,transparent 35%),radial-gradient(circle at 70% 60%,#ede9fe,transparent 35%),#eef2f7;position:relative;overflow:hidden"><div style="position:absolute;inset:30px;border:2px dashed #c7cfdd;border-radius:40%;transform:rotate(-5deg)"></div><div style="position:absolute;left:18%;top:35%;font-size:26px">📍<small style="display:block;font-size:11px">Dubai</small></div><div style="position:absolute;left:58%;top:24%;font-size:26px">📍<small style="display:block;font-size:11px">Japan</small></div><div style="position:absolute;left:45%;top:63%;font-size:26px">📍<small style="display:block;font-size:11px">Switzerland</small></div><div style="position:absolute;right:15%;top:45%;font-size:26px">📍<small style="display:block;font-size:11px">Safari</small></div><div style="position:absolute;left:25%;bottom:18%;font-size:26px">📍<small style="display:block;font-size:11px">Singapore</small></div><div style="position:absolute;bottom:18px;left:18px;background:#fff;padding:10px;border-radius:10px;font-size:12px;box-shadow:var(--shadow)">Map foundation • live map integration will replace this view</div></div><br><div class="grid g3">${card('Visited','<div class="metric">12</div><p class="sub">Countries together</p>')}${card('Wishlist','<div class="metric">18</div><p class="sub">Places saved by family</p>')}${card('Memories','<div class="metric">286</div><p class="sub">Location-linked memories</p>')}</div>`,
memories:`<div class="pagehead"><div><div class="eyebrow">Our story</div><h1>Memories</h1><p class="sub">Keep the experiences that make the family story.</p></div><button class="btn">+ Add memory</button></div><div class="grid g3">${['Dubai 2026','Goa 2025','Singapore 2024','London 2023','Family wedding','Weekend escape'].map((x,i)=>`<div class="card"><div style="height:130px;border-radius:13px;background:linear-gradient(135deg,${['#dbeafe,#c4b5fd','#fed7aa,#fecdd3','#bbf7d0,#bfdbfe','#ddd6fe,#bae6fd','#fef3c7,#fbcfe8','#cffafe,#ddd6fe'][i]});display:grid;place-items:center;font-size:42px">${['🌆','🌴','🦁','🏛️','❤️','🚗'][i]}</div><br><h3>${x}</h3><p class="small">${18+i*7} photos • ${i+1} video</p></div>`).join('')}</div><br>${card('Our Story',`<p class="sub">A shared timeline that combines family history, trips, milestones and everyday moments. Older generations can add stories; children can add discoveries and memories of their own.</p><br><button class="btn alt">Open family story</button>`)}`,
vault:`<div class="pagehead"><div><div class="eyebrow">Private & protected</div><h1>Secure Family Vault</h1><p class="sub">Sensitive family information should be visible only to the people who need it.</p></div><button class="btn">+ Add document</button></div><div class="notice">🔐 Prototype view. Production RS One should use encrypted storage, strict role permissions, audit history and parent approval for sensitive actions.</div><br><div class="grid g3">${card('Documents','<div class="metric">24</div><p class="sub">Document records</p><span class="tag green">8 expiring later</span>')}${card('Parent-only','<div class="metric">9</div><p class="sub">Restricted records</p><span class="tag pink">Protected</span>')}${card('Shared','<div class="metric">15</div><p class="sub">Family-access records</p><span class="tag blue">Controlled</span>')}</div><br>${card('Document index',`<table class="table"><tr><th>Document</th><th>Owner</th><th>Access</th><th>Status</th></tr><tr><td>Passport record</td><td>Dad</td><td>Parent only</td><td><span class="tag green">Valid</span></td></tr><tr><td>Travel insurance</td><td>Family</td><td>Adults</td><td><span class="tag blue">Active</span></td></tr><tr><td>School record</td><td>Aarav</td><td>Parent only</td><td><span class="tag yellow">Review</span></td></tr></table>`)}`,
