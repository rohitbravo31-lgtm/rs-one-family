<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>RS One — One place for everything that matters.</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#172033}.app{min-height:100vh;display:flex}.side{width:245px;background:#111827;color:white;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{padding:5px 12px 22px}.brand b{font-size:25px}.brand small{display:block;color:#aeb7c9;margin-top:4px}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#b9c2d2;text-align:left;padding:10px 12px;border-radius:10px;font-weight:650;cursor:pointer}.nav button:hover,.nav button.active{background:#29334a;color:white}.main{margin-left:245px;width:calc(100% - 245px)}header{height:68px;background:white;border-bottom:1px solid #e5e8ef;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}header strong{font-size:14px}.status{font-size:11px;color:#69748a;background:#f0f2f7;padding:7px 10px;border-radius:99px}.content{max-width:1200px;margin:auto;padding:34px 30px 90px}.section{display:none}.section.active{display:block}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#6355df}.head h1{font-size:34px;letter-spacing:-1px;margin:7px 0 4px}.head p{margin:0;color:#69748a}.primary,.small{border:0;background:#5b4ce6;color:white;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:white;border:1px solid #e5e8ef;border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;min-height:108px}.icon{width:42px;height:42px;border-radius:12px;background:#eeebff;color:#5b4ce6;display:grid;place-items:center;font-size:20px;flex:none}.card div:nth-child(2){flex:1}.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0 0 4px;font-size:14px}.card small{color:#8992a3}.feature{margin-top:16px;padding:27px;border-radius:20px;background:linear-gradient(135deg,#111827,#28375e);color:white}.feature h2{margin:6px 0;font-size:25px}.feature p{color:#c7cfdf;line-height:1.55;max-width:700px}.planner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.step{background:white;border:1px solid #e5e8ef;border-radius:13px;padding:16px}.step b{color:#6355df;font-size:12px}.step span{display:block;margin-top:9px;font-weight:700;font-size:13px}.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.explore button{background:white;border:1px solid #e5e8ef;border-radius:17px;padding:23px;text-align:left;cursor:pointer;font-size:25px}.explore b,.explore span{display:block}.explore b{font-size:16px;margin-top:9px}.explore span{font-size:12px;color:#7d8798;margin-top:3px}.mobile{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#111827;color:white;padding:12px 17px;border-radius:11px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.side{display:none}.main{margin-left:0;width:100%}header{padding:0 16px}.content{padding:25px 15px 90px}.head{align-items:flex-start}.head h1{font-size:29px}.cards{grid-template-columns:1fr}.planner{grid-template-columns:1fr 1fr}.explore{grid-template-columns:1fr 1fr}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e5eb;z-index:10;padding:6px}.mobile button{border:0;background:none;font-size:10px;color:#778195;padding:5px}.mobile button.active{color:#5b4ce6;font-weight:800}.mobile span{display:block;font-size:18px;margin-bottom:2px}.small{display:none}}
@media(max-width:450px){.planner{grid-template-columns:1fr}.explore{grid-template-columns:1fr 1fr}.status{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>RS One</b><small>One place for everything that matters.</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header><strong id="title">Family Home</strong><span class="status">Private family space • Prototype</span></header><div class="content" id="content"></div></main></div><nav class="mobile" id="mobile"></nav><div class="toast" id="toast"></div><script>
const pages={home:['Home','What matters to your family right now'],vision:['Family Vision','Dream together. Plan together.'],explore:['Explore','Discover something new together.'],travel:['Travel','From dream to approved itinerary.'],family:['Family','Your private family space.'],money:['Money','Plan the economics of every adventure.'],memberships:['Memberships','Keep family travel benefits working for you.'],map:['Map','See where you have been and where you want to go.'],memories:['Memories','Keep the family story alive.'],vault:['Vault','Important family documents, protected.'],alerts:['Alerts','Stay on top of what matters.'],analytics:['Analytics','Understand your family travel story.'],data:['Data','Import, export and keep your family data portable.']};
const data={home:[['Next adventure','Japan • 2027','Family planning target'],['Family Wishlist','12 shared ideas','Places, experiences and dreams'],['Family Pulse','5 members active','Latest family activity'],['RS One suggestion','Consider Japan next','Strong family fit + new experience']],vision:[['2026','Dubai','Family experience'],['2027','Japan','Culture • food • discovery'],['2028','Switzerland','Mountains • trains • family time'],['2029','Safari','Wildlife • nature • memories'],['2030','Northern Lights','A long-term family dream']],travel:[['Trip brief','Japan','5 family members • ₹4.5L target'],['Flights','Best overall','Comfort + timing + baggage'],['Hotels','Family fit','Location + room + breakfast'],['Itinerary','Ready for approval','Day-by-day family plan']],family:[['Dad','Parent','Travel • aviation • planning'],['Mum','Parent','Food • culture • comfort'],['Aarav','Child','Science • football • discovery'],['Mia','Child','Animals • art • travel'],['Grandparent','Family','History • heritage • comfort']],money:[['USD / INR','₹83.20','Live rate placeholder'],['Gold 24K','₹—','Live market connection'],['Silver','₹—','Live market connection'],['Japan budget','₹4.5L','Current family target']],memberships:[['Airline benefits','Connected accounts','Miles • baggage • seats • status'],['Hotel benefits','Connected accounts','Rates • breakfast • upgrades'],['Benefits found','8','Potential savings / benefits'],['Future connectors','Expandable','Add providers without rebuilding RS One']],map:[['Visited','14 places','Family travel history'],['Wishlist','9 places','Future destinations'],['Memories','32','Photos and moments pinned to places'],['Next','Japan','Planning destination']],memories:[['Our Story','Family history','Older generations + today’s experiences'],['Dubai','2026','Trip memory collection'],['Singapore','2025','Trip memory collection'],['Family moments','32 memories','Photos • videos • places']],vault:[['Documents','18','Family document index'],['Parent-only','7','Sensitive documents'],['Shared','11','Selected family members'],['Security','Enabled','Sensitive actions require approval']],alerts:[['Travel','Japan planning','Review flight and hotel options'],['Wishlist','New family vote','Japan received a new vote'],['Membership','Benefit reminder','Review an upcoming benefit'],['Daily summary','Family activity','3 updates across RS One']],analytics:[['Trips','8','Family trips recorded'],['Countries','14','Countries explored'],['Travel spend','₹—','Connect live expense data later'],['Memories','32','Family memories recorded']],data:[['Excel','Import / Export','Portable family data'],['CSV','Import / Export','Simple structured data'],['JSON','Backup / Restore','RS One family package'],['Privacy','Your data','Keep sensitive documents out of ordinary exports']]};
const nav=document.getElementById('nav'),mobile=document.getElementById('mobile'),content=document.getElementById('content');Object.entries(pages).forEach(([key,v])=>{nav.innerHTML+=`<button data-page="${key}">${v[0]}</button>`});['home','vision','explore','travel','family'].forEach(k=>mobile.innerHTML+=`<button data-page="${k}"><span>${k==='home'?'⌂':k==='vision'?'✦':k==='explore'?'◈':k==='travel'?'✈':'●'}</span>${pages[k][0]}</button>`);
function show(key){const [name,sub]=pages[key];document.getElementById('title').textContent=name;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===key));let body='';if(key==='explore'){body='<div class="explore">'+[['🌍','World','Countries & cities'],['🔬','Science','Learn something new'],['🚀','Space','Explore beyond Earth'],['🍜','Food','Culture through food'],['🐘','Animals','Wildlife & nature'],['🧠','Family Quiz','Play and learn together']].map(x=>`<button onclick="toastMsg('${x[1]} opened.')">${x[0]}<b>${x[1]}</b><span>${x[2]}</span></button>`).join('')+'</div>'}else{body='<div class="cards">'+(data[key]||[]).map((x,i)=>`<article class="card"><div class="icon">${['✦','◈','●','◆'][i%4]}</div><div><h3>${x[0]}</h3><p>${x[1]}</p><small>${x[2]}</small></div><button class="small" onclick="toastMsg('${x[0]} opened.')">Open</button></article>`).join('')+'</div>'}if(key==='home')body+='<div class="feature"><b class="eyebrow">FAMILY VISION</b><h2>Build the life you want to remember.</h2><p>RS One brings family wishes, travel, memories, money and important information into one private home.</p><button class="primary" onclick="show(\'vision\')">Open Family Vision</button></div>';if(key==='travel')body+='<div class="planner">'+[['01','Tell RS One what the family wants'],['02','Search & compare live options'],['03','Build cost & itinerary'],['04','Family approval before booking']].map(x=>`<div class="step"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div>';content.innerHTML=`<section class="section active"><div class="head"><div><span class="eyebrow">RS ONE</span><h1>${name}</h1><p>${sub}</p></div><button class="primary" onclick="toastMsg('${name} is ready for the next build.')">+ Add</button></div>${body}</section>`;window.scrollTo(0,0)}function toastMsg(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),1800)}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)});show('home');
</script></body></html>
