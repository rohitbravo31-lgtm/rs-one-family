<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS One</title><meta name="description" content="RS One — One place for everything that matters."><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#172033}header{padding:22px 24px;background:linear-gradient(135deg,#312e81,#2563eb);color:white}header h1{margin:0 0 4px;font-size:28px}header p{margin:0;opacity:.9}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:white;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.nav button{border:1px solid #dbe1ea;background:#fff;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700;color:#344054}.nav button.active{background:#312e81;color:#fff;border-color:#312e81}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:white;border-radius:20px;padding:28px;box-shadow:0 5px 20px #0000000b;margin-bottom:18px}.hero h2{font-size:32px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #e7eaf0;border-radius:16px;padding:20px;min-height:150px}.card h3{margin:0 0 10px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.cta{display:inline-block;margin-top:14px;background:#2563eb;color:white;padding:11px 15px;border-radius:10px;text-decoration:none;border:0;cursor:pointer;font-weight:700}.muted{color:#667085;line-height:1.55}.screen{display:none}.screen.active{display:block}.list{padding-left:20px;line-height:1.9}@media(max-width:600px){.wrap{padding:14px}.hero{padding:20px}.hero h2{font-size:25px}.nav{position:relative}.nav button{flex:1 1 auto}}
</style></head><body><header><h1>RS One</h1><p>One place for everything that matters.</p></header><nav class="nav" id="nav"></nav><main class="wrap" id="app"></main><script>
const tabs=[['home','Home'],['vision','Vision'],['explore','Explore'],['travel','Travel'],['family','Family'],['money','Money'],['memberships','Memberships'],['map','Map'],['memories','Memories'],['vault','Vault'],['alerts','Alerts'],['analytics','Analytics'],['data','Data']];
const content={
home:['Welcome to RS One','Your family’s digital home. Start with what matters right now.',['Next Adventure','Family Vision','Family Wishlist','Family Pulse']],
vision:['Family Vision','Turn individual dreams into shared family goals.',['Dreams & Goals','Wishlist','Family Voting','Vision Timeline']],
explore:['Explore','Discover places, facts, activities and ideas for every generation.',['World','Children','Quizzes','Interests']],
travel:['Travel','Plan the journey from dream to itinerary.',['Trip Planner','Flights','Hotels','Itinerary','Trip Cost']],
family:['Family','Manage family profiles, roles, preferences and shared activity.',['Profiles','Roles & Permissions','Preferences','Family Pulse']],
money:['Money','Understand trip economics, currencies and family budgets.',['Currency','Gold & Silver','Budgets','Destination Compare']],
memberships:['Memberships & Loyalty','Keep airline, hotel and travel benefits in one place.',['Airlines','Hotels','Travel Accounts','Benefits & Status']],
map:['Map','See destinations, trips, planned places and memories geographically.',['Visited','Wishlist','Itinerary','Memories']],
memories:['Memories','Keep the family story connected to the places you experience.',['Photos','Videos','Trips','Our Story']],
vault:['Secure Vault','A protected area for important family documents and records.',['Documents','Access Control','Audit History','Security']],
alerts:['Alerts','Keep the family informed without exposing sensitive information.',['Travel Updates','Wishlist Updates','Price Alerts','Notification Settings']],
analytics:['Analytics','Understand family travel, spending and experiences over time.',['Trips','Destinations','Spending','Family Statistics']],
data:['Data','Import, export and preserve the family’s information.',['Excel / CSV','JSON','Travel History','Backup & Export']]
};
function renderNav(active){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${id===active?'active':''}" onclick="show('${id}')">${label}</button>`).join('')}
function show(id){const [title,sub,items]=content[id];document.getElementById('app').innerHTML=`<section class="screen active"><div class="hero"><span class="pill">RS One</span><h2>${title}</h2><p class="muted">${sub}</p><button class="cta" onclick="alert('This section is ready for the next RS One build.')">Explore this section</button></div><div class="grid">${items.map(x=>`<article class="card"><h3>${x}</h3><p class="muted">${description(x)}</p></article>`).join('')}</div></section>`;renderNav(id);history.replaceState(null,'','#'+id)}
function description(x){const d={ 'Next Adventure':'See the family’s upcoming plan at a glance.','Family Vision':'Shared dreams, goals and long-term plans.','Family Wishlist':'Ideas the family has chosen to consider together.','Family Pulse':'Recent family activity and updates.','Dreams & Goals':'Capture meaningful goals beyond travel.','Wishlist':'Personal and shared wishes in one place.','Family Voting':'Let family members express their preferences.','Vision Timeline':'See the family journey across future years.','World':'Discover destinations and countries.','Children':'Age-appropriate discovery and learning.','Quizzes':'Family-friendly quizzes and challenges.','Interests':'Explore topics each member enjoys.','Trip Planner':'Build a trip from requirements to approval.','Flights':'Compare flight options and value.','Hotels':'Compare family-suitable accommodation.','Itinerary':'Organise days, places and travel time.','Trip Cost':'Build a complete family trip estimate.','Profiles':'Individual family identity and preferences.','Roles & Permissions':'Control access by family role.','Preferences':'Remember what each member likes.','Currency':'Track and convert travel currencies.','Gold & Silver':'Keep an eye on precious-metal values.','Budgets':'Plan and understand family travel spending.','Destination Compare':'Compare destinations on practical economics.','Airlines':'Connect supported airline memberships.','Hotels':'Connect supported hotel memberships.','Travel Accounts':'Keep travel loyalty relationships organised.','Benefits & Status':'Use eligible benefits when comparing options.','Visited':'Places the family has experienced.','Wishlist':'Places the family wants to experience.','Itinerary':'Trip locations and routes.','Memories':'Photos and stories connected to places.','Photos':'Family photographs organised by trip and place.','Videos':'Family videos and highlights.','Trips':'A history of family journeys.','Our Story':'Build the family story over time.','Documents':'Important records with controlled access.','Access Control':'Parent and role-based permissions.','Audit History':'See important security actions.','Security':'Privacy and device protection.','Travel Updates':'Important journey notifications.','Wishlist Updates':'Changes to shared family plans.','Price Alerts':'Watch important travel prices.','Notification Settings':'Choose what each family member receives.','Trips':'Understand travel patterns over time.','Destinations':'Countries and places explored.','Spending':'Review travel spending trends.','Family Statistics':'See meaningful family milestones.','Excel / CSV':'Move structured information in and out.','JSON':'Portable family data format.','Travel History':'Preserve earlier journeys.','Backup & Export':'Keep a controlled copy of family data.'};return d[x]||'A foundation for the RS One family workspace.'}
const initial=location.hash.slice(1);show(content[initial]?initial:'home');
</script></body></html>
